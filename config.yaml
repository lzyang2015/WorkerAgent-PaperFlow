profiles:
  default:
    summary_prompt: "请总结这篇论文的核心贡献、方法和实验结果。使用 Markdown 格式。"
    presentation_prompt: "请基于这篇论文生成一份技术分享的 PPT 大纲，包含 5-7 页幻灯片内容。"
    keep_source: false
    timeout: 1800.0
    max_retries: 5
    output_dir: "/Users/eric/CodeEnv/KMOps/ObsidianKBase/PaperRead"

  cs:
    summary_prompt: "你是一个资深教授，而我只有小学文化水平，但我明天需要去介绍这篇论文的思路，你帮我做一个详细的指导。首先将该论文的摘要部分全文翻译成中文，提取并详细解释其中的关键概念；其次我需要从以下几个方面详细了解：1.这篇论文要解决什么问题，这个问题的由来是什么；2.他提出了什么系统化的方法来解决这个问题；方法指向这个问题的哪些难点或者有挑战的环节；3.具体讲讲方法是什么；4.如何来验证这个方法可行的思路是什么；5.批判性来看，论文还有哪些不足，包括：①对问题难点的理解是否准确；②方法存在哪些劣势；③实验是否充分；④实验解决是否可信；"
    presentation_prompt: "使用中文，完成一个20页的ppt来详细解读这篇论文。1. 清晰表述论文所提出的问题，并介绍问题的背景是什么；2.结构化表述该问题的难点和挑战在哪里；对应本论文的创新点是什么；3.结构化表达本论文提出的解决问题的整体方法框架，和构思出这个框架的关键理由；4.详细解读论文的关键算法（逐行说明原理），和关键公式（解读公式的整体含义，各个分项的含义）；5.对论文的实验和实验分析做详细的说明，每个实验得到的结论是什么；6.对论文提出批判性思考，包括：创新点是否针对关键性的难点在解决，提出的方法可能有哪些缺陷，实验结论是否可信，遗漏了哪些需要实验验证的问题；"
    keep_source: false
    timeout: 1800.0
    max_retries: 5
    output_dir: "/Users/eric/CodeEnv/KMOps/ObsidianKBase/PaperRead"

  cs-ori:
    summary_prompt: "作为计算机科学专家，请分析这篇论文的算法创新点、复杂度分析和对比实验。请使用 Markdown 格式。"
    presentation_prompt: "请为这篇论文生成一份技术分享的演示文稿内容。请使用 Markdown 格式，每一页幻灯片使用 '---' 分隔，包含标题和要点。第一页为封面，包含标题和作者。"
    keep_source: false
    timeout: 1800.0
    max_retries: 5
    output_dir: "/Users/eric/CodeEnv/KMOps/ObsidianKBase/PaperRead"
